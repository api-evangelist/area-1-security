name: Area 1 Security
description: 'Area 1 Security was a cloud-native email security company that built preemptive
  anti-phishing and business-email-compromise (BEC) protection, discovering and blocking phishing
  campaigns before they reached inboxes. It could be deployed inline (MX/journaling) or via API
  connectors to Microsoft 365 and Google Workspace. Cloudflare acquired Area 1 Security in February
  2022 for approximately $162 million and folded the technology into its Zero Trust / Cloudflare One
  platform, where it is now sold as Cloudflare Email Security. The independent area1security.com
  developer surface has been retired and now redirects to Cloudflare; the product API and
  documentation live under the Cloudflare developer platform.'
